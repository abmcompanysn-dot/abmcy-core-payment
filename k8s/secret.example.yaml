# Modèle — NE PAS committer les vraies valeurs. Créer le secret réel avec :
#
#   kubectl -n abmcy-core create secret generic abmcy-core-secrets \
#     --from-literal=DATABASE_URL='postgres://diarra:<PWD>@postgres.diarra.svc.cluster.local:5432/abmcy_core?sslmode=disable' \
#     --from-literal=DIARRA_GATEWAY_URL='https://api.diarra.app' \
#     --from-literal=DIARRA_GATEWAY_API_KEY='<clé créée via /admin/gateway>' \
#     --from-literal=DIARRA_GATEWAY_HMAC_SECRET='<secret créé via /admin/gateway>' \
#     --from-literal=ABMCY_CORE_CALLBACK_URL='https://core.diarra.app/webhooks/diarra' \
#     --from-literal=ABMCY_ADMIN_TOKEN='<jeton admin ABMCY Core, aléatoire>'
apiVersion: v1
kind: Secret
metadata:
  name: abmcy-core-secrets
  namespace: abmcy-core
type: Opaque
stringData:
  DATABASE_URL: "postgres://diarra:CHANGEME@postgres.diarra.svc.cluster.local:5432/abmcy_core?sslmode=disable"
  DIARRA_GATEWAY_URL: "https://api.diarra.app"
  DIARRA_GATEWAY_API_KEY: "CHANGEME"
  DIARRA_GATEWAY_HMAC_SECRET: "CHANGEME"
  ABMCY_CORE_CALLBACK_URL: "https://core.diarra.app/webhooks/diarra"
  ABMCY_ADMIN_TOKEN: "CHANGEME"
